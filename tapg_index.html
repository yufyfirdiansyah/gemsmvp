<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAPG Terminal | Trading Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body
  class="antialiased min-h-screen bg-white dark:bg-[#09090b] text-slate-900 dark:text-zinc-100 selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icons = {
      TrendingUp: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>,
      TrendingDown: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>,
      Clock: ({ size = 12, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
      Zap: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
      Sun: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
      Moon: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
    };

    const TAPGDashboard = () => {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [isDarkMode, setIsDarkMode] = useState(true);

      const fmt = (num) => Number(num || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      const fmtIdr = (num) => Number(num || 0).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

      // REPLACE WITH YOUR APPS SCRIPT WEB APP URL
      const API_URL = "https://script.google.com/macros/s/AKfycbyiJxQQjsEDUKkJXj22tnSOfXUFJMaZqubKx5F6DgxKYjkXdYLZovTWohpSvCKo1yKPwA/exec";

      const fetchData = async () => {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Network error: " + response.status);

          const text = await response.text();
          try {
            const result = JSON.parse(text);
            setData(result);
            setError(null);
            setLoading(false);
          } catch (e) {
            console.error("JSON Parse Error:", text);
            throw new Error("Invalid data format from script. Check if Sheet is ready.");
          }
        } catch (err) {
          console.error("Fetch Error:", err);
          setError(err.message || "Connection failed.");
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 30000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDarkMode);
      }, [isDarkMode]);

      if (loading) return (
        <div className="min-h-screen flex items-center justify-center bg-[#09090b]">
          <div className="flex flex-col items-center gap-4">
            {error ? (
              <div className="text-center p-8 bg-red-500/10 border border-red-500/50 rounded-3xl max-w-sm">
                <p className="text-red-500 font-bold mb-4">{error}</p>
                <button
                  onClick={() => { setLoading(true); fetchData(); }}
                  class="px-6 py-2 bg-red-500 text-white rounded-full text-xs font-bold uppercase tracking-widest hover:bg-red-600 transition-colors"
                >
                  Retry Connection
                </button>
              </div>
            ) : (
              <>
                <div className="h-12 w-12 border-4 border-zinc-800 border-t-emerald-500 animate-spin rounded-full"></div>
                <p className="font-sans text-zinc-500 tracking-tighter uppercase text-xs">Loading TAPG Terminal...</p>
              </>
            )}
          </div>
        </div>
      );

      // --- Decision Logic ---
      const eidoDiff = (Number(data?.eido_reg_close) - Number(data?.eido_open)).toFixed(2);
      const isEidoUp = Number(eidoDiff) >= 0;

      const isShanghaiUp = !data?.shanghai_delta.includes('-');
      const isNiftyUp = !data?.nifty_delta.includes('-');
      const isSoybeanUp = !data?.soybean_delta.includes('-');

      const tapgPrice = Number(data?.tapg_close || 0);
      const isVolBuy = Number(data?.tapg_vol) > Number(data?.vol_ma20);
      const isMa20Buy = tapgPrice > Number(data?.ma20_val);
      const isVwapBuy = tapgPrice > Number(data?.vwap_cur);

      const isBuy = isEidoUp && isShanghaiUp && isNiftyUp && isSoybeanUp && isVolBuy && isMa20Buy && isVwapBuy;
      const finalDecision = isBuy ? "BUY" : "NO TRADE";

      return (
        <div className="max-w-6xl mx-auto p-4 md:p-10 font-sans">
          {/* HEADER */}
          <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-12 gap-6 border-b border-zinc-200 dark:border-zinc-800 pb-8">
            <div>
              <div className="flex items-center gap-3 mb-2">
                <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="p-2 rounded-full bg-zinc-200 dark:bg-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-300 dark:hover:bg-zinc-700 transition-colors"
                >
                  {isDarkMode ? <Icons.Sun size={16} /> : <Icons.Moon size={16} />}
                </button>
                <span className="bg-emerald-600 text-white text-[10px] font-black px-2 py-0.5 rounded italic shadow-lg shadow-emerald-500/20">PALM OIL LIVE</span>
                <h1 className="text-3xl font-black tracking-tighter uppercase italic text-slate-800 dark:text-white">Trading Dashboard <span className="text-emerald-500">TAPG.JK</span></h1>
              </div>
              <p className="text-zinc-500 text-[10px] flex items-center gap-2 uppercase tracking-widest">
                <Icons.Clock size={12} /> LAST SYNC: {data?.timestamp}
              </p>
            </div>

            <div className={`px-8 py-4 rounded-2xl border-2 flex items-center gap-6 transition-all duration-500 ${isBuy ? 'bg-emerald-500/10 border-emerald-500 shadow-[0_0_25px_rgba(16,185,129,0.25)]' : 'bg-zinc-100 dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800'}`}>
              <div className="text-right">
                <p className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">SOP DECISION</p>
                <p className={`text-3xl font-black ${isBuy ? 'text-emerald-500' : 'text-zinc-500'}`}>{finalDecision}</p>
              </div>
              <Icons.Zap size={32} className={isBuy ? 'text-emerald-500 animate-pulse' : 'text-zinc-700'} />
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* MACRO PANEL */}
            <div className="lg:col-span-4 space-y-6">
              <div className="bg-zinc-50 dark:bg-zinc-900/40 border border-zinc-200 dark:border-zinc-800 p-6 rounded-3xl">
                <h3 className="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em] mb-6">Global Sentiment</h3>

                <div className="space-y-6">
                  {/* EIDO */}
                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <span className="font-bold text-xs uppercase">EIDO <span className="text-zinc-500 text-[9px]">ETF</span></span>
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isEidoUp ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>{isEidoUp ? 'UP' : 'DOWN'}</span>
                        <span className={`font-bold text-sm ${isEidoUp ? 'text-emerald-500' : 'text-red-500'}`}>{isEidoUp ? '+' : ''}{eidoDiff}</span>
                      </div>
                    </div>
                    <div className="bg-white dark:bg-black p-3 rounded-xl border border-zinc-200 dark:border-zinc-800 flex justify-between text-[10px] text-zinc-500">
                      <span>AH: ${fmt(data?.eido_ah)}</span>
                      <span>C: ${fmt(data?.eido_reg_close)}</span>
                      <span>O: ${fmt(data?.eido_open)}</span>
                    </div>
                  </div>

                  {/* SHANGHAI */}
                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <span className="font-bold text-xs uppercase text-zinc-400">SHANGHAI <span className="text-[9px]">(GAP)</span></span>
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isShanghaiUp ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>{isShanghaiUp ? 'UP' : 'DOWN'}</span>
                        <span className={`font-bold text-sm ${isShanghaiUp ? 'text-emerald-500' : 'text-red-500'}`}>{data?.shanghai_delta}</span>
                      </div>
                    </div>
                  </div>

                  {/* NIFTY */}
                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <span className="font-bold text-xs uppercase text-zinc-400">NIFTY 50</span>
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isNiftyUp ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>{isNiftyUp ? 'UP' : 'DOWN'}</span>
                        <span className={`font-bold text-sm ${isNiftyUp ? 'text-emerald-500' : 'text-red-500'}`}>{data?.nifty_delta}</span>
                      </div>
                    </div>
                  </div>

                  {/* SOYBEAN */}
                  <div>
                    <div className="flex justify-between items-end mb-2">
                      <span className="font-bold text-xs uppercase text-zinc-400">SOYBEAN</span>
                      <div className="flex items-center gap-2">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isSoybeanUp ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>{isSoybeanUp ? 'UP' : 'DOWN'}</span>
                        <span className={`font-bold text-sm ${isSoybeanUp ? 'text-emerald-500' : 'text-red-500'}`}>{data?.soybean_delta}</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              {/* VOLUME CARD */}
              <div className={`p-6 rounded-3xl border transition-all duration-300 ${isVolBuy ? 'bg-emerald-500/10 border-emerald-500/50' : 'bg-red-500/10 border-red-500/50'}`}>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em]">Volume Flow</h3>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded ${isVolBuy ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>{isVolBuy ? 'BUY' : 'SELL'}</span>
                </div>
                <p className="text-2xl font-bold text-slate-800 dark:text-white uppercase leading-none tracking-tighter">{fmt(data?.tapg_vol)}</p>
                <p className="text-[10px] text-zinc-500 italic mt-1">AVG 20D: {fmt(data?.vol_ma20)}</p>
              </div>
            </div>

            {/* MAIN TERMINAL */}
            <div className="lg:col-span-8 bg-zinc-50 dark:bg-zinc-950 rounded-[2.5rem] p-8 md:p-12 border border-zinc-200 dark:border-zinc-800 relative overflow-hidden shadow-2xl">
              <div className="absolute top-0 right-0 p-10 opacity-5 pointer-events-none">
                <Icons.TrendingUp size={240} />
              </div>

              <div className="relative z-10">
                <div className="flex flex-col md:flex-row justify-between items-start mb-16 gap-8">
                  <div>
                    <span className="text-emerald-500 text-[10px] font-black tracking-[0.3em] uppercase">Palm Oil Sector • IDX</span>
                    <h2 className="text-8xl font-black tracking-tighter text-slate-900 dark:text-white leading-none mt-4">TAPG</h2>
                    <p className="text-zinc-500 text-sm font-medium mt-2 tracking-wide uppercase">Triputra Agro Persada</p>
                  </div>
                  <div className="text-left md:text-right">
                    <p className="text-zinc-600 text-[10px] font-black uppercase tracking-widest mb-2">Price Action</p>
                    <div className="flex flex-col items-start md:items-end">
                      <div className="text-[10px] text-zinc-500 font-bold tracking-widest mb-1">CLOSE</div>
                      <p className="text-6xl font-bold text-slate-800 dark:text-white tracking-tighter mb-4">
                        <span className="text-2xl font-normal text-zinc-500 dark:text-zinc-700 mr-2">IDR</span>
                        {fmtIdr(data?.tapg_close)}
                      </p>
                      <div className="text-[10px] text-zinc-500 font-bold tracking-widest mb-1">OPEN</div>
                      <p className="text-3xl font-bold text-slate-600 dark:text-zinc-400 tracking-tighter">
                        <span className="text-xl font-normal text-zinc-400 dark:text-zinc-600 mr-2">IDR</span>
                        {fmtIdr(data?.tapg_open)}
                      </p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {/* MA20 */}
                  <div className={`bg-white/50 dark:bg-zinc-900/50 backdrop-blur-md border ${isMa20Buy ? 'border-emerald-500/30' : 'border-red-500/30'} p-8 rounded-[2rem] transition-colors`}>
                    <div className="flex justify-between items-center mb-6 text-zinc-500">
                      <span className="text-[10px] font-black uppercase tracking-widest">Trend (MA20)</span>
                      <span className={`text-[10px] font-bold px-3 py-1 rounded-full border ${isMa20Buy ? 'text-emerald-400 border-emerald-400/30 bg-emerald-400/5' : 'text-red-400 border-red-400/30 bg-red-400/5'}`}>{isMa20Buy ? 'BUY' : 'SELL'}</span>
                    </div>
                    <p className="text-4xl font-bold text-slate-800 dark:text-white mb-2 tracking-tighter">Rp {fmtIdr(data?.ma20_val)}</p>
                    <p className="text-[10px] text-zinc-600 uppercase">Value Baseline</p>
                  </div>

                  {/* VWAP */}
                  <div className={`bg-white/50 dark:bg-zinc-900/50 backdrop-blur-md border ${isVwapBuy ? 'border-emerald-500/30' : 'border-red-500/30'} p-8 rounded-[2rem] transition-colors`}>
                    <div className="flex justify-between items-center mb-6 text-zinc-500">
                      <span className="text-[10px] font-black uppercase tracking-widest">VWAP</span>
                      <span className={`text-[10px] font-bold px-3 py-1 rounded-full border ${isVwapBuy ? 'text-emerald-400 border-emerald-400/30 bg-emerald-400/5' : 'text-red-400 border-red-400/30 bg-red-400/5'}`}>{isVwapBuy ? 'BUY' : 'SELL'}</span>
                    </div>
                    <div className="flex items-end justify-between">
                      <div>
                        <p className="text-4xl font-bold text-slate-800 dark:text-white mb-2 tracking-tighter">Rp {fmtIdr(data?.vwap_cur)}</p>
                        <p className="text-[10px] text-zinc-600 uppercase italic">PREV: Rp {fmtIdr(data?.vwap_prev)}</p>
                      </div>
                      <div className={`p-3 rounded-2xl ${data?.vwap_cur > data?.vwap_prev ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>
                        {data?.vwap_cur > data?.vwap_prev ? <Icons.TrendingUp size={24} /> : <Icons.TrendingDown size={24} />}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TAPGDashboard />);
  </script>
</body>

</html>
