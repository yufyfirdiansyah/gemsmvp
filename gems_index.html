<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEMS Terminal | Coal Trading Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            coal: {
              50: '#f8f8f8',
              900: '#0c0c0e',
              950: '#050506',
            }
          }
        }
      }
    }
  </script>
</head>

<body
  class="antialiased min-h-screen bg-white dark:bg-coal-950 text-slate-900 dark:text-zinc-100 selection:bg-orange-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icons = {
      TrendingUp: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>,
      TrendingDown: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>,
      Clock: ({ size = 12, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
      Zap: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>,
      Sun: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,
      Moon: ({ size = 24, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,
      Activity: ({ size = 20, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>,
    };

    const GEMSDashboard = () => {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [isDarkMode, setIsDarkMode] = useState(true);

      const fmt = (num) => Number(num || 0).toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      const fmtIdr = (num) => Number(num || 0).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

      // REPLACE WITH YOUR APPS SCRIPT WEB APP URL
      const API_URL = "https://script.google.com/macros/s/AKfycbxtoXT64MtQjghTIuHjyMEzyoFleVOVBG0jnp-KKUysCSrtQtjJnKrwmjUJYwrYCjpN/exec";

      const fetchData = async () => {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("Network error: " + response.status);
          const result = await response.json();
          setData(result);
          setError(null);
          setLoading(false);
        } catch (err) {
          console.error("Fetch Error:", err);
          setError("Check Apps Script URL or Connection.");
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
        const interval = setInterval(fetchData, 30000);
        return () => clearInterval(interval);
      }, []);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDarkMode);
      }, [isDarkMode]);

      if (loading) return (
        <div className="min-h-screen flex items-center justify-center bg-coal-950">
          <div className="flex flex-col items-center gap-4">
            <div className="h-12 w-12 border-4 border-zinc-800 border-t-orange-500 animate-spin rounded-full"></div>
            <p className="font-sans text-zinc-500 tracking-widest uppercase text-[10px]">Initializing GEMS Terminal...</p>
          </div>
        </div>
      );

      // --- Decision Logic ---
      const isFxiUp = !data?.fxi_delta?.includes('-');
      const isNgUp = !data?.ng_delta?.includes('-');
      const isUsdIdrUp = !data?.usdidr_delta?.includes('-'); // Weaker IDR (+) is good for GEMS
      const isBtuUp = !data?.btu_delta?.includes('-');
      const isWhcUp = !data?.whc_delta?.includes('-');

      const gemsPrice = Number(data?.gems_close || 0);
      const isVolBuy = Number(data?.gems_vol) > Number(data?.gems_vol_ma20);
      const isMa20Buy = gemsPrice > Number(data?.gems_ma20);
      const isVwapBuy = gemsPrice > Number(data?.gems_vwap_cur);

      const macroCount = [isFxiUp, isNgUp, isUsdIdrUp, isBtuUp, isWhcUp].filter(Boolean).length;
      const isBuy = macroCount >= 4 && isVolBuy && isMa20Buy && isVwapBuy;
      const finalDecision = isBuy ? "STRONG BUY" : macroCount >= 3 ? "WATCHING" : "NO TRADE";

      const MacroItem = ({ label, delta, last, isUp, info }) => (
        <div className="group">
          <div className="flex justify-between items-end mb-2">
            <div className="flex flex-col">
              <span className="font-bold text-[11px] uppercase tracking-wider text-zinc-400 group-hover:text-zinc-200 transition-colors">{label}</span>
              <span className="text-[9px] text-zinc-600 uppercase font-medium">{info}</span>
            </div>
            <div className="flex flex-col items-end">
              <span className={`text-[11px] font-black px-2 py-0.5 rounded ${isUp ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>
                {delta}
              </span>
              <span className="text-[10px] font-mono text-zinc-500 mt-1">{fmt(last)}</span>
            </div>
          </div>
          <div className="h-[1px] w-full bg-zinc-800/50 mt-3"></div>
        </div>
      );

      return (
        <div className="max-w-7xl mx-auto p-4 md:p-8 lg:p-12 font-sans">
          {/* TOP BAR */}
          <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6">
            <div className="flex items-center gap-4">
              <div className="p-3 rounded-2xl bg-orange-500/10 text-orange-500 border border-orange-500/20 shadow-[0_0_20px_rgba(249,115,22,0.1)]">
                <Icons.Activity size={24} />
              </div>
              <div>
                <h1 className="text-2xl font-black tracking-tight uppercase flex items-center gap-2 italic">
                  GEMS <span className="text-orange-500">Terminal</span>
                  <span className="text-[10px] not-italic font-bold bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded ml-2 border border-zinc-700">COAL SECTOR</span>
                </h1>
                <p className="text-zinc-500 text-[10px] flex items-center gap-2 uppercase tracking-[0.2em] mt-1 font-bold">
                  <Icons.Clock size={12} /> SYNC: {data?.timestamp}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-4">
               <button
                  onClick={() => setIsDarkMode(!isDarkMode)}
                  className="p-3 rounded-2xl bg-zinc-100 dark:bg-zinc-900 text-zinc-500 hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-all border border-zinc-200 dark:border-zinc-800"
                >
                  {isDarkMode ? <Icons.Sun size={18} /> : <Icons.Moon size={18} />}
                </button>
                <div className={`px-6 py-3 rounded-2xl border flex items-center gap-4 transition-all duration-500 ${isBuy ? 'bg-emerald-500/10 border-emerald-500' : 'bg-zinc-900 border-zinc-800'}`}>
                  <div className="text-right">
                    <p className="text-[9px] font-bold text-zinc-500 uppercase tracking-widest mb-0.5">SOP STRATEGY</p>
                    <p className={`text-xl font-black ${isBuy ? 'text-emerald-500' : 'text-zinc-400'}`}>{finalDecision}</p>
                  </div>
                  <Icons.Zap size={24} className={isBuy ? 'text-emerald-500 animate-pulse' : 'text-zinc-700'} />
                </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* LEFT: MACRO SENTIMENT */}
            <div className="lg:col-span-4 space-y-6">
              <div className="bg-zinc-50 dark:bg-coal-900 border border-zinc-200 dark:border-zinc-800 p-8 rounded-[2rem] shadow-xl">
                <div className="flex items-center justify-between mb-8">
                   <h3 className="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em]">Global Coal Vectors</h3>
                   <span className="text-[10px] font-bold text-orange-500 bg-orange-500/10 px-2 py-0.5 rounded">{macroCount}/5 BULLISH</span>
                </div>

                <div className="space-y-6">
                  <MacroItem label="FXI (China)" delta={data?.fxi_delta} last={data?.fxi_last} isUp={isFxiUp} info="ETF Large Cap" />
                  <MacroItem label="NG=F (Gas)" delta={data?.ng_delta} last={data?.ng_last} isUp={isNgUp} info="Natural Gas Futures" />
                  <MacroItem label="USD/IDR" delta={data?.usdidr_delta} last={data?.usdidr_last} isUp={isUsdIdrUp} info="Currency Margin" />
                  <MacroItem label="BTU (Peabody)" delta={data?.btu_delta} last={data?.btu_last} isUp={isBtuUp} info="NYSE Sentiment" />
                  <MacroItem label="WHC.AX" delta={data?.whc_delta} last={data?.whc_last} isUp={isWhcUp} info="ASX Coal Proxy" />
                </div>
                
                <div className="mt-8 p-4 bg-orange-500/5 rounded-2xl border border-orange-500/10 text-[10px] text-zinc-500 italic leading-relaxed">
                   Logic: Strong alignment (4+ indices) indicates high probability for GEMS open movement.
                </div>
              </div>

              {/* VOLUME CARD */}
              <div className={`p-8 rounded-[2rem] border-2 transition-all duration-300 ${isVolBuy ? 'bg-emerald-500/5 border-emerald-500/20' : 'bg-red-500/5 border-red-500/20'}`}>
                <div className="flex justify-between items-center mb-6">
                  <h3 className="text-zinc-500 text-[10px] font-black uppercase tracking-[0.2em]">Volume Flow</h3>
                  <span className={`text-[10px] font-bold px-3 py-1 rounded-full ${isVolBuy ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/20' : 'bg-red-500 text-white'}`}>{isVolBuy ? 'ACCUM' : 'LOW VOL'}</span>
                </div>
                <p className="text-3xl font-black text-slate-800 dark:text-white tracking-tighter">{fmt(data?.gems_vol)}</p>
                <div className="flex items-center gap-2 mt-2">
                  <div className="h-1.5 w-full bg-zinc-800 rounded-full overflow-hidden">
                    <div className={`h-full ${isVolBuy ? 'bg-emerald-500' : 'bg-red-500'}`} style={{width: `${Math.min((data?.gems_vol / data?.gems_vol_ma20) * 100, 100)}%`}}></div>
                  </div>
                  <span className="text-[10px] text-zinc-500 font-mono whitespace-nowrap">MA: {fmt(data?.gems_vol_ma20)}</span>
                </div>
              </div>
            </div>

            {/* RIGHT: MAIN PRICE ACTION */}
            <div className="lg:col-span-8 bg-zinc-50 dark:bg-coal-900 rounded-[3rem] p-8 md:p-14 border border-zinc-200 dark:border-zinc-800 relative overflow-hidden shadow-2xl">
              <div className="absolute top-0 right-0 p-12 opacity-5 pointer-events-none text-orange-500">
                <Icons.Activity size={320} />
              </div>

              <div className="relative z-10">
                <div className="flex flex-col md:flex-row justify-between items-start mb-20 gap-10">
                  <div>
                    <span className="text-orange-500 text-[11px] font-black tracking-[0.4em] uppercase mb-4 block">Golden Energy & Mines • IDX</span>
                    <h2 className="text-8xl font-black tracking-tighter text-slate-900 dark:text-white leading-none">GEMS</h2>
                    <p className="text-zinc-500 text-sm font-medium mt-4 tracking-wide uppercase flex items-center gap-2">
                       <span className="h-2 w-2 rounded-full bg-orange-500 animate-pulse"></span>
                       Coal Mining Sector • Indonesia
                    </p>
                  </div>
                  <div className="bg-white/5 dark:bg-black/20 p-6 rounded-[2.5rem] border border-zinc-800/50 backdrop-blur-sm">
                    <div className="flex flex-col items-start md:items-end">
                      <div className="text-[10px] text-zinc-500 font-bold tracking-widest mb-2 uppercase">Current Close</div>
                      <p className="text-6xl font-black text-slate-800 dark:text-white tracking-tighter mb-4">
                        <span className="text-2xl font-normal text-zinc-600 mr-2">IDR</span>
                        {fmtIdr(data?.gems_close)}
                      </p>
                      <div className="h-[1px] w-full bg-zinc-800 mb-4"></div>
                      <div className="flex gap-8">
                         <div>
                            <div className="text-[9px] text-zinc-600 font-bold uppercase tracking-widest">Open</div>
                            <p className="text-lg font-bold text-zinc-400">Rp {fmtIdr(data?.gems_open)}</p>
                         </div>
                         <div className="text-right">
                            <div className="text-[9px] text-zinc-600 font-bold uppercase tracking-widest">Change</div>
                            <p className={`text-lg font-bold ${data?.gems_close >= data?.gems_open ? 'text-emerald-500' : 'text-red-500'}`}>
                               {((data?.gems_close - data?.gems_open) / data?.gems_open * 100).toFixed(2)}%
                            </p>
                         </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                  {/* MA20 CARD */}
                  <div className={`bg-white/50 dark:bg-zinc-800/20 backdrop-blur-xl border-2 ${isMa20Buy ? 'border-emerald-500/20' : 'border-red-500/20'} p-10 rounded-[2.5rem] transition-all hover:scale-[1.02]`}>
                    <div className="flex justify-between items-center mb-8">
                      <span className="text-[10px] font-black uppercase tracking-widest text-zinc-500">Trend (MA20)</span>
                      <span className={`text-[9px] font-black px-4 py-1.5 rounded-full border ${isMa20Buy ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/5' : 'text-red-400 border-red-500/30 bg-red-500/5'}`}>{isMa20Buy ? 'BULLISH' : 'BEARISH'}</span>
                    </div>
                    <p className="text-5xl font-black text-slate-800 dark:text-white mb-2 tracking-tighter">Rp {fmtIdr(data?.gems_ma20)}</p>
                    <p className="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">Moving Average Baseline</p>
                  </div>

                  {/* VWAP CARD */}
                  <div className={`bg-white/50 dark:bg-zinc-800/20 backdrop-blur-xl border-2 ${isVwapBuy ? 'border-emerald-500/20' : 'border-red-500/20'} p-10 rounded-[2.5rem] transition-all hover:scale-[1.02]`}>
                    <div className="flex justify-between items-center mb-8">
                      <span className="text-[10px] font-black uppercase tracking-widest text-zinc-500">Intraday VWAP</span>
                      <span className={`text-[9px] font-black px-4 py-1.5 rounded-full border ${isVwapBuy ? 'text-emerald-400 border-emerald-500/30 bg-emerald-500/5' : 'text-red-400 border-red-500/30 bg-red-500/5'}`}>{isVwapBuy ? 'ABOVE' : 'BELOW'}</span>
                    </div>
                    <div className="flex items-end justify-between">
                      <div>
                        <p className="text-5xl font-black text-slate-800 dark:text-white mb-2 tracking-tighter">Rp {fmtIdr(data?.gems_vwap_cur)}</p>
                        <div className="flex items-center gap-2">
                           <span className={`text-[10px] font-bold ${data?.gems_vwap_cur >= data?.gems_vwap_prev ? 'text-emerald-500' : 'text-red-500'}`}>
                              PREV: Rp {fmtIdr(data?.gems_vwap_prev)}
                           </span>
                        </div>
                      </div>
                      <div className={`p-4 rounded-2xl ${data?.gems_vwap_cur >= data?.gems_vwap_prev ? 'bg-emerald-500/10 text-emerald-500' : 'bg-red-500/10 text-red-500'}`}>
                        {data?.gems_vwap_cur >= data?.gems_vwap_prev ? <Icons.TrendingUp size={32} /> : <Icons.TrendingDown size={32} />}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<GEMSDashboard />);
  </script>
</body>

</html>
